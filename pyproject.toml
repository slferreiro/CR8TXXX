[project]
name = "cr8txxx"
version = "0.1.0"
description = "CR8TXXX: manage a Mixxx library and its crates outside Mixxx, and find damaged music files"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Sean Ferreiro" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",  # Qt Widgets, Gui, Svg (not WebEngine & co.)
    "tinytag>=2.0",
]

[project.scripts]
cr8txxx = "cr8txxx.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cr8txxx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
